# =============================================================================
# BCI real-time protocol — configuração principal
# =============================================================================
# Uso normal:
#   1) ajuste sujeito/sessão;
#   2) escolha protocol.stage;
#   3) rode: python main.py
#
# ETAPA 1 — single_target
#   EM_treino -> IM_treino -> online target com feedback -> sem feedback
#   Modelo: perna-alvo vs REST_STIM
#
# ETAPA 2 — two_legs
#   EM_treino -> IM_treino -> online com feedback -> online sem feedback
#   Modelo: LEFT vs RIGHT vs REST_STIM
#
# As duas etapas têm exatamente a mesma sequência. O que muda é somente
# quais classes entram no modelo/controle online. Para passar de uma etapa
# para a outra, troque stage e rode main.py novamente.
# =============================================================================

# #############################################################################
# PARÂMETROS PRINCIPAIS
# #############################################################################

experiment:
  subject_id    : "TEST"
  session_id    : 1
  exp_name      : "TEST"
  session_type  : "IM_treino"   # o main altera conforme a fase
  log_root      : "C:/Users/User/Desktop/Dados"

runtime:
  simulate_signal  : true        # true = simulação; false = g.HIamp

protocol:
  stage          : "single_target"  # single_target | two_legs
  start_phase    : "auto"           # auto | execution | imagery | online

  # Usado somente em single_target.
  online_target  : "right"          # left | right

  # auto resolve conforme stage:
  #   single_target -> target_vs_rest
  #   two_legs      -> left_right_vs_rest
  training_mode  : "auto"

  block_end_code       : 99
  block_end_label      : "BLOCK_END"
  motor_session_type   : "EM_treino"
  imagery_session_type : "IM_treino"

  # Online da ETAPA 1.
  online_modes_single_target:
    - name          : "target_feedback"
      label         : "Online target com feedback PCA"
      session_type  : "IM_online_target_PCA"
      feedback_mode : "pca"

    - name          : "target_no_feedback"
      label         : "Online target sem feedback"
      session_type  : "IM_online_target_sem_feedback"
      feedback_mode : "none"

  # Online da ETAPA 2 — mesma sequência da etapa 1.
  online_modes_two_legs:
    - name          : "two_legs_feedback"
      label         : "Online duas pernas com feedback PCA"
      session_type  : "IM_online_duas_pernas_PCA"
      feedback_mode : "pca"

    - name          : "two_legs_no_feedback"
      label         : "Online duas pernas sem feedback"
      session_type  : "IM_online_duas_pernas_sem_feedback"
      feedback_mode : "none"

  min_cv_accuracy      : null
  auto_check_data      : true
  online_model_prefix  : "latest"      # sempre usa o IM_treino mais recente
  model_session_types  : ["IM_treino"]

# #############################################################################
# CONFIGURAÇÕES TÉCNICAS / AVANÇADAS
# #############################################################################

lsl:
  marker_name   : "GrazMI_Markers"
  marker_type   : "Markers"
  signal_name   : "gHIamp_EEG"
  signal_type   : "EEG"
  decoder_name  : "Signal"
  decoder_type  : "BCI"

psychopy:
  enabled                 : true
  mode                    : "psyexp"
  experiment_file         : "experiment/Graz_UpperLimb.psyexp"
  generated_script        : "experiment/Graz_UpperLimb_autorun.py"
  fallback_script         : null
  stim_sequence           : "experiment/stims_sequence.csv"
  python_executable       : null
  compile_version         : null
  compile_if_changed      : true
  inject_session_info     : true
  hide_info_dialog        : true
  new_console             : false
  pre_launch_pause_s      : 2.0
  startup_grace_s         : 10.0
  startup_status_every_s  : 5.0
  startup_timeout_s       : 90.0
  marker_stall_timeout_s  : 60.0
  exit_grace_s            : 5.0
  max_block_duration_s    : null

fs_hz                    : 256.0
n_channels               : 16
trial_duration_s         : 3.75
trial_offset_s           : 0.0
window_s                 : 1.0
step_s                   : 0.05
filter_mode              : "causal"
bp_order                 : 3
bp_band_hz               : [5.0, 40.0]
select_by                : "index"
index_base               : 1
select_channels          : []
feature_space            : "riemann_pca"
classifier               : "svm_linear"
pca_dim                  : 2
svc_c                    : 1.0
cv_splits                : 5
rng_seed                 : 42
decoder_outlet_name      : "Signal"
decoder_outlet_type      : "BCI"
decoder_lsl_rate_hz      : 64.0

representation_feedback:
  dimensions      : 2
  name            : "PCA"
  pad_frac        : 0.10
  grid_size       : 240
  density_masses  : [0.50, 0.80, 0.95]
  show_labels     : true
  transform:
    type: "identity"

# O stream mantém [rep1, rep2, left, both, right] para compatibilidade com Unity.
# REST_STIM não ocupa canal motor: REST = nenhuma perna ativada.
control:
  enabled                     : true
  outlet_name                 : "GrazMI_Control"
  outlet_type                 : "BCIControl"
  entry_density_mass          : 0.50
  hold_density_mass           : 0.80
  enter_persist_s             : 0.25
  exit_persist_s              : 0.20
  min_probability             : 0.40
  min_probability_margin      : 0.05
  allow_probability_fallback  : true
  movement_rise_s             : 1.20
  movement_fall_s             : 0.80
  output_rate_hz              : 60.0
  decoder_stale_s             : 0.60

check_tmin_s    : -0.5
check_save_png  : true

# Sinal simulado. REST_STIM = ruído/basal, sem burst motor.
sim_chunk             : 10
sim_noise_std         : 0.8
sim_burst_freq_hz     : 10.0
sim_burst_amp         : 1.5
sim_taper_frac        : 0.2
sim_profile_left_mi   : [1.0, 0.3]
sim_profile_both_mi   : [1.0, 1.0]   # legado
sim_profile_right_mi  : [0.3, 1.0]

# Marcadores do protocolo.
# REST (6) = pausa intertrial; REST_STIM (8) = condição experimental.
codes:
  left_mi    : 3
  right_mi   : 4
  both_mi    : 7      # legado; não aparece na sequência atual
  rest_stim  : 8
  attempt    : 5
  block_end  : 99
  map:
    "1"  : "BASELINE"
    "2"  : "ATTENTION"
    "3"  : "LEFT_MI_STIM"
    "4"  : "RIGHT_MI_STIM"
    "5"  : "ATTEMPT"
    "6"  : "REST"
    "7"  : "BOTH_MI_STIM"
    "8"  : "REST_STIM"
    "99" : "BLOCK_END"

hiamp:
  gtec_root               : "D:/Documentos/gtec/gNEEDaccessClientAPI"
  acquisition_channels    : 16
  reference_channel       : 16
  drop_reference_channel  : true
  reference_mode          : "car"
  chunk                   : 10

debug_plot:
  enabled      : false
  script       : "tools/plot_decoder_realtime.py"
  new_console  : false
