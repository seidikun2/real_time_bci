# =============================================================================
# BCI real-time protocol config
# =============================================================================
# Os parâmetros abaixo são globais: o mesmo valor é usado no sinal simulado,
# no treino do classificador, no check_data e na inferência online.

# -----------------------------
# Identificação da sessão
# -----------------------------
experiment:
  subject_id:      "TT000"
  session_id:      1
  log_root:        "C:/Users/User/Desktop/Dados"
  exp_name:        "TEST"
  session_type:    "IM_treino"       # opções: EM_treino, IM_treino, IM_online

# -----------------------------
# Streams LSL
# -----------------------------
lsl:
  marker_name:     "GrazMI_Markers"
  marker_type:     "Markers"
  signal_name:     "gHIamp_EEG"
  signal_type:     "EEG"
  decoder_name:    "Signal"
  decoder_type:    "BCI"

# -----------------------------
# Fluxo do protocolo
# -----------------------------
runtime:
  simulate_signal: true               # opções: true, false

# -----------------------------
# PsychoPy: execução automática
# -----------------------------
# O main compila o .psyexp diretamente com o Python do PsychoPy e abre um
# processo novo a cada bloco. Não é necessário abrir o Builder/Runner antes.
psychopy:
  enabled: true

  # Fonte preferida. "psyexp" = compila automaticamente; "auto" permite
  # fallback para o _lastrun.py se a compilação falhar; "script" usa só fallback.
  mode: "psyexp"                       # opções: psyexp, auto, script
  experiment_file: "Graz_UpperLimb.psyexp"
  generated_script: "Graz_UpperLimb_autorun.py"
  fallback_script: "Graz_UpperLimb_lastrun.py"

  # Deixe null para autodetectar. Se necessário, use por exemplo:
  # "C:/Program Files/PsychoPy/python.exe"
  python_executable: null
  compile_version: null                # null = versão do PsychoPy instalado
  compile_if_changed: true             # recompila somente se o .psyexp mudou

  # O main injeta subject/session no script gerado e evita a caixa de diálogo
  # de participante em toda rodada. O .psyexp original não é alterado.
  inject_session_info: true
  hide_info_dialog: true

  # Gerenciamento do processo.
  new_console: false
  exit_grace_s: 5.0                    # tempo para salvar/fechar após BLOCK_END
  startup_timeout_s: 60.0              # sem nenhum marcador após abrir = falha
  marker_stall_timeout_s: 60.0         # sem marcadores durante o bloco = travamento
  max_block_duration_s: null           # opcional: limite absoluto do bloco

protocol:
  start_phase:             "imagery"  # opções: execution, imagery, online
  block_end_code:          99
  block_end_label:         "BLOCK_END"
  motor_session_type:      "EM_treino"
  imagery_session_type:    "IM_treino"
  online_session_type:     "IM_online"
  min_cv_accuracy:         null          # exemplo: 0.70; null = decisão manual
  auto_check_data:         true          # opções: true, false
  online_model_prefix:     "ask"         # opções: ask, latest, auto, ou prefixo explícito
  model_session_types:     ["EM_treino", "IM_treino"]
  realtime_plot:           true          # opções: true, false
  realtime_plot_script:    "plot_decoder_realtime.py"
  realtime_plot_new_console: true        # opções: true, false

# =============================================================================
# Parâmetros globais do sinal e da pipeline
# =============================================================================
# Frequência única de todo o pipeline. O simulado, o treino e o online devem
# trabalhar nessa mesma taxa para evitar discrepâncias de janela/filtro.
fs_hz:             256.0
n_channels:        16

# Duração do período ATTEMPT no TREINO. O online não usa trials; ele apenas
# infere continuamente a última janela de window_s segundos.
trial_duration_s:  3.75
trial_offset_s:    0.0

# Janela de feature. O treino extrai janelas de window_s dentro de cada trial;
# o online usa a última janela contínua de window_s.
window_s:          1.0
step_s:            0.05

# Filtro temporal comum ao treino, check e online.
filter_mode:       "causal"             # opções: causal, zero_phase_offline
bp_order:          3
bp_band_hz:        [5.0, 40.0]

# Canais. Lista vazia = todos. Índices por padrão são base-1.
select_by:         "index"              # opções: index, name
index_base:        1                     # opções: 0, 1
select_channels:   []                    # exemplo: [1, 2, 4, 5, 7, 9, 10]

# Modelo.
feature_space:     "riemann_pca"        # opções: riemann_pca
classifier:        "svm_linear"         # opções: svm_linear
pca_dim:           2
svc_c:             1.0
cv_splits:         5
rng_seed:          42

# Saída do decoder.
decoder_outlet_name: "Signal"
decoder_outlet_type: "BCI"
decoder_lsl_rate_hz: 64.0
left_label:        null
right_label:       null

# -----------------------------------------------------------------------------
# Feedback visual genérico da representação
# -----------------------------------------------------------------------------
# O Unity não conhece PCA/alinhamento. Ele recebe apenas rep1/rep2, já no
# espaço FINAL abaixo. O mapa de densidade é gerado após este transform.
representation_feedback:
  dimensions:       2
  name:             "PCA"
  pad_frac:         0.10
  grid_size:        240
  density_masses:   [0.50, 0.80, 0.95]
  show_labels:      true

  # Hoje: identidade (rep1/rep2 = PCA1/PCA2).
  # Futuro: um alinhamento pode ser aplicado aqui ou implementado diretamente
  # em representation_feedback.py. Para Procrustes/afim, por exemplo:
  #
  # transform:
  #   type: "affine"
  #   matrix: [[1.0, 0.0], [0.0, 1.0]]
  #   offset: [0.0, 0.0]
  #   scale: 1.0
  transform:
    type: "identity"

# Check/figuras.
check_tmin_s:      -0.5
check_save_png:    true                 # opções: true, false

# =============================================================================
# Simulação de sinal
# =============================================================================
sim_chunk:         10
sim_noise_std:     0.8
sim_burst_freq_hz: 10.0
sim_burst_amp:     1.5
sim_taper_frac:    0.2
sim_profile_left_mi:  [1.0, 0.3]
sim_profile_right_mi: [0.3, 1.0]

# -----------------------------
# Códigos de marcadores
# -----------------------------
codes:
  left_mi:         3
  right_mi:        4
  attempt:         5
  block_end:       99
  map:
    "1":           "BASELINE"
    "2":           "ATTENTION"
    "3":           "LEFT_MI_STIM"
    "4":           "RIGHT_MI_STIM"
    "5":           "ATTEMPT"
    "6":           "REST"
    "99":          "BLOCK_END"
